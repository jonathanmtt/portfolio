<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>OG image</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #f6f3ee; color: #16181d; font-family: "Instrument Sans", sans-serif; position: relative; }
  .left { position: absolute; left: 72px; top: 70px; width: 560px; }
  .brand { display: flex; align-items: center; gap: 14px; font-weight: 600; font-size: 26px; letter-spacing: -.02em; }
  .mark { width: 52px; height: 52px; border-radius: 14px; background: #16181d; color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 22px; }
  h1 { margin: 54px 0 0; font-weight: 600; font-size: 70px; line-height: 1.02; letter-spacing: -.04em; }
  h1 span { font-family: "Instrument Serif", serif; font-style: italic; font-weight: 400; color: #c43d17; font-size: 1.08em; }
  .pills { position: absolute; left: 72px; bottom: 64px; display: flex; gap: 12px; }
  .pills b { font-weight: 600; font-size: 21px; padding: 12px 20px; border-radius: 999px; background: #fff; border: 2px solid #e2dcd2; }
  .pills b.hot { background: #c43d17; color: #fff; border-color: #c43d17; }
  .shot { position: absolute; right: -60px; top: 92px; width: 600px; border-radius: 16px; overflow: hidden; background: #fff; border: 2px solid #e2dcd2; box-shadow: 0 30px 60px -20px rgba(22,24,29,.35); transform: rotate(-3deg); }
  .bar { height: 30px; background: #f2eee7; border-bottom: 2px solid #e2dcd2; display: flex; align-items: center; gap: 7px; padding: 0 14px; }
  .bar i { width: 10px; height: 10px; border-radius: 50%; background: #d8d1c5; }
  .shot img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="left">
    <div class="brand"><div class="mark">JM</div>Jonathan Mattos</div>
    <h1>Websites for local businesses, <span>live in 7 days.</span></h1>
  </div>
  <div class="pills"><b class="hot">Free homepage preview</b><b>Fixed price</b><b>EN / PT</b></div>
  <div class="shot"><div class="bar"><i></i><i></i><i></i></div><img src="../img/demo-auto.webp" alt=""></div>
</body>
</html>
